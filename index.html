<script>


function openMenu(){


  document
    .getElementById("menu")
    .classList
    .add("open");


}




function closeMenu(){


  document
    .getElementById("menu")
    .classList
    .remove("open");


}




function showRoyal(){


  document
    .getElementById("royal")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


}




function showProduct(id){


  document
    .querySelectorAll(".product-detail")
    .forEach(function(el){


      el.classList.remove("active");


    });




  document
    .querySelectorAll(".product-grid")
    .forEach(function(el){


      el.classList.add("hidden");


    });




  document
    .getElementById(id)
    .classList
    .add("active");




  setTimeout(function(){


    document
      .getElementById(id)
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });


  },50);


}




function backToRoyal(){


  document
    .querySelectorAll(".product-detail")
    .forEach(function(el){


      el.classList.remove("active");


    });




  document
    .querySelectorAll(".product-grid")
    .forEach(function(el){


      el.classList.remove("hidden");


    });




  document
    .getElementById("royal")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


}


</script>
